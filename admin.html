<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEMI · Administração</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--red:#921914;--cream:#fff8e6;--ink:#3f120f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Archivo,Arial,sans-serif}header{background:var(--red);color:var(--cream);padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600}h1{margin:0;font-size:27px}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #ecd9d0;border-radius:17px;padding:23px;margin-bottom:20px;box-shadow:0 8px 25px #3f120f0b}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #d7c5bc}input{width:100%;margin:6px 0 13px}button{cursor:pointer;background:var(--red);color:white;border-color:var(--red);font-weight:600}button.secondary{background:white;color:var(--red)}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{max-width:100%}.hidden{display:none!important}.muted{color:#77645d}.error{color:#a00000;white-space:pre-wrap}.ok{color:#176a39}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.order{background:#fff;border:1px solid #e5d3c9;border-radius:15px;padding:19px;overflow-wrap:anywhere}.order h3{margin:0 0 8px;font-size:18px}.order p{line-height:1.5}.order select{width:100%;margin:8px 0}.order button{width:100%}.details{background:#fff8e6;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#logout{background:var(--cream);color:var(--red)}@media(max-width:600px){header{padding:15px}h1{font-size:23px}}
</style></head><body><header><h1>femi · Administração</h1><button id="logout" class="hidden">Sair</button></header><main><section id="login" class="panel"><h2>Acesso administrativo</h2><p class="muted">Entre com uma conta autorizada no Supabase Auth e cadastrada em femi_admins.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">Entrar</button></form><p id="loginMsg" role="status"></p></section><section id="dashboard" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><h2>Pedidos recebidos</h2><p class="muted" id="counter">Carregando...</p></div><button id="refresh">Atualizar pedidos</button></div><div class="row"><label>Filtrar por status <select id="filter"><option value="">Todos os pedidos</option></select></label></div><p id="statusMsg" role="status"></p></div><div id="orders" class="orders"></div></section></main><script>
'use strict';
const BASE='https://dxpnsxtvmsjyzalauvlf.supabase.co';
const KEY='sb_publishable_fGzGA0wWG7yo-DYTzGg3Ow_zBu37fRq';
const STATUSES=['Aguardando confirmação','Confirmado','Em andamento','Enviado','Entregue','Cancelado'];
let session=null,orders=[];
const $=id=>document.getElementById(id);
function msg(id,message,error=false){$(id).textContent=message;$(id).className=error?'error':'ok'}
async function request(path,options={}){const headers={'apikey':KEY,'Content-Type':'application/json',...(session?{'Authorization':'Bearer '+session.access_token}:{}) ,...(options.headers||{})};const response=await fetch(BASE+path,{...options,headers});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!response.ok)throw new Error((data&& (data.message||data.msg||data.error_description||data.error))||('HTTP '+response.status));return data}
function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden') }
function showLogin(){session=null;sessionStorage.removeItem('femi_admin_session');$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden')}
async function checkAdmin(){const user=await request('/auth/v1/user');if(!user||!user.id)throw new Error('Sessão inválida');const records=await request('/rest/v1/femi_admins?select=user_id&user_id=eq.'+encodeURIComponent(user.id)+'&limit=1');if(!Array.isArray(records)||records.length===0)throw new Error('Esta conta não tem permissão de administrador.');return true}
async function loadOrders(){msg('statusMsg','Consultando pedidos...');try{orders=await request('/rest/v1/femi_pedidos?select=*&order=criado_em.desc&limit=200');if(!Array.isArray(orders))throw new Error('Resposta inesperada do banco');render();msg('statusMsg','Pedidos atualizados.')}catch(e){msg('statusMsg','Não foi possível consultar os pedidos: '+e.message,true)}}
function formatMoney(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function formatDate(s){if(!s)return 'Não informado';const d=new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString('pt-BR')}
function line(parent,tag,content,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=content;parent.append(el);return el}
function render(){const container=$('orders');container.replaceChildren();$('counter').textContent=orders.length+' pedido(s) encontrado(s) (até 200 recentes)';const statuses=[...new Set([...STATUSES,...orders.map(o=>o.status).filter(Boolean)])];const filter=$('filter'),current=filter.value;filter.replaceChildren(new Option('Todos os pedidos',''));statuses.forEach(s=>filter.add(new Option(s,s)));filter.value=current;const filtered=orders.filter(o=>!filter.value||o.status===filter.value);if(!filtered.length){line(container,'p','Nenhum pedido encontrado.','muted');return}for(const o of filtered){const card=document.createElement('article');card.className='order';line(card,'h3','Pedido '+String(o.id||'').slice(0,8));line(card,'p','Data: '+formatDate(o.criado_em));line(card,'p','Total: '+formatMoney(o.total));line(card,'p','Pagamento: '+(o.forma_pagamento||'Não informado'));line(card,'p','Status atual: '+(o.status||'Não informado'));const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Ver detalhes do pedido';details.append(summary);const data=document.createElement('div');data.className='details';data.textContent=JSON.stringify(o,null,2);details.append(data);card.append(details);const select=document.createElement('select');select.setAttribute('aria-label','Novo status do pedido');statuses.forEach(s=>select.add(new Option(s,s)));select.value=o.status||statuses[0];card.append(select);const save=document.createElement('button');save.textContent='Salvar status';save.onclick=async()=>{if(select.value===o.status)return;save.disabled=true;try{await request('/rest/v1/femi_pedidos?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({status:select.value})}).then(data=>{if(!Array.isArray(data)||data.length!==1)throw new Error('Atualização não confirmada. Verifique as permissões de UPDATE.');});o.status=select.value;render();msg('statusMsg','Status atualizado no Supabase.')}catch(e){msg('statusMsg','Erro ao atualizar: '+e.message,true)}finally{save.disabled=false}};card.append(save);container.append(card)}}
$('filter').onchange=render;$('refresh').onclick=loadOrders;$('logout').onclick=showLogin;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;msg('loginMsg','Autenticando...');try{const auth=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});session=auth;await checkAdmin();sessionStorage.setItem('femi_admin_session',JSON.stringify(session));$('password').value='';showDashboard();await loadOrders()}catch(err){showLogin();msg('loginMsg',err.message,true)}finally{$('loginButton').disabled=false}};
(async()=>{try{const saved=sessionStorage.getItem('femi_admin_session');if(!saved)return;session=JSON.parse(saved);await checkAdmin();showDashboard();await loadOrders()}catch{showLogin()}})();
</script></body></html>
